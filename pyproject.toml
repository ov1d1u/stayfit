[project]
name = "ha-stayfit"
version = "0.1.0"
description = "StayFit custom integration for Home Assistant"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ARG001",
  "ARG002",
  "ANN401",
  "COM812",
  "D107",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "S105",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "DTZ001",
  "PLR0913",
  "PLR2004",
  "S101",
  "S106",
  "SLF001",
]
